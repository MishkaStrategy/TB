name: Publish immutable release evidence
description: Publish exact-commit evidence directly from the current job without Actions artifact storage.
inputs:
  source_path:
    description: One or more newline-separated files/directories produced by this job.
    required: true
  asset_name:
    description: Purpose-specific asset name (the repository and exact SHA are prepended automatically).
    required: true
  commit_sha:
    description: Exact 40-character commit SHA proven by this evidence.
    required: true
  draft:
    description: Create a private draft evidence release when no release exists.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Publish immutable exact-commit evidence
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_PATHS: ${{ inputs.source_path }}
        PURPOSE_NAME: ${{ inputs.asset_name }}
        EVIDENCE_COMMIT_SHA: ${{ inputs.commit_sha }}
        DRAFT_RELEASE: ${{ inputs.draft }}
      run: |
        set -euo pipefail

        [[ "${EVIDENCE_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
          echo "commit_sha must be an exact lowercase 40-character SHA" >&2
          exit 1
        }
        [[ "${PURPOSE_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || {
          echo "asset_name contains unsafe characters" >&2
          exit 1
        }
        case "${DRAFT_RELEASE}" in
          true|false) ;;
          *) echo "draft must be true or false" >&2; exit 1 ;;
        esac

        sources=()
        while IFS= read -r source; do
          [[ -z "${source}" ]] && continue
          [[ -e "${source}" ]] || { echo "Evidence source does not exist: ${source}" >&2; exit 1; }
          sources+=("${source}")
        done <<< "${SOURCE_PATHS}"
        ((${#sources[@]} > 0)) || { echo "No evidence sources were supplied" >&2; exit 1; }

        repository_name="${GITHUB_REPOSITORY#*/}"
        if [[ ! "${repository_name}" =~ ^[A-Za-z0-9] ]]; then
          repository_name="repo${repository_name}"
        fi
        asset_name="${repository_name}-${EVIDENCE_COMMIT_SHA}-${PURPOSE_NAME}"
        tag="ci-evidence-${EVIDENCE_COMMIT_SHA}"
        temporary_directory="$(mktemp -d)"
        trap 'rm -rf "${temporary_directory}"' EXIT
        prepared_asset="${temporary_directory}/${asset_name}"

        if ((${#sources[@]} == 1)) && [[ -f "${sources[0]}" ]]; then
          cp "${sources[0]}" "${prepared_asset}"
        elif [[ "${asset_name}" == *.zip ]]; then
          python3 - "${prepared_asset}" "${sources[@]}" <<'PY'
        import sys
        import zipfile
        from pathlib import Path

        destination = Path(sys.argv[1])
        sources = [Path(value) for value in sys.argv[2:]]
        flatten_single_directory = len(sources) == 1 and sources[0].is_dir()

        names = set()
        with zipfile.ZipFile(destination, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
            for source in sources:
                if source.is_symlink():
                    raise SystemExit(f'Symlink evidence source is forbidden: {source}')
                candidates = sorted(source.rglob('*')) if source.is_dir() else [source]
                for candidate in candidates:
                    if candidate.is_symlink():
                        raise SystemExit(f'Symlink evidence entry is forbidden: {candidate}')
                    if not candidate.is_file():
                        continue
                    if flatten_single_directory:
                        archive_name = candidate.relative_to(source)
                    elif source.is_dir():
                        archive_name = candidate.relative_to(source.parent)
                    else:
                        archive_name = Path(source.name)
                    archive_name = archive_name.as_posix()
                    if archive_name in names:
                        raise SystemExit(f'Duplicate archive entry: {archive_name}')
                    names.add(archive_name)
                    info = zipfile.ZipInfo(archive_name, date_time=(1980, 1, 1, 0, 0, 0))
                    info.compress_type = zipfile.ZIP_DEFLATED
                    info.external_attr = 0o100644 << 16
                    archive.writestr(info, candidate.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
        PY
        else
          [[ "${asset_name}" == *.tar.gz ]] || {
            echo "asset_name must end in .tar.gz when publishing a directory or multiple paths" >&2
            exit 1
          }
          python3 - "${prepared_asset}" "${sources[@]}" <<'PY'
        import gzip
        import io
        import sys
        import tarfile
        from pathlib import Path

        destination = Path(sys.argv[1])
        sources = [Path(value) for value in sys.argv[2:]]
        flatten_single_directory = len(sources) == 1 and sources[0].is_dir()
        names = set()

        with destination.open('wb') as raw:
            with gzip.GzipFile(fileobj=raw, mode='wb', mtime=0, filename='') as compressed:
                with tarfile.open(fileobj=compressed, mode='w') as archive:
                    for source in sources:
                        if source.is_symlink():
                            raise SystemExit(f'Symlink evidence source is forbidden: {source}')
                        candidates = sorted(source.rglob('*')) if source.is_dir() else [source]
                        for candidate in candidates:
                            if candidate.is_symlink():
                                raise SystemExit(f'Symlink evidence entry is forbidden: {candidate}')
                            if not candidate.is_file():
                                continue
                            if flatten_single_directory:
                                archive_name = candidate.relative_to(source)
                            elif source.is_dir():
                                archive_name = candidate.relative_to(source.parent)
                            else:
                                archive_name = Path(source.name)
                            archive_name = archive_name.as_posix()
                            if archive_name in names:
                                raise SystemExit(f'Duplicate archive entry: {archive_name}')
                            names.add(archive_name)
                            payload = candidate.read_bytes()
                            info = tarfile.TarInfo(archive_name)
                            info.size = len(payload)
                            info.mode = 0o644
                            info.mtime = 0
                            info.uid = info.gid = 0
                            info.uname = info.gname = ''
                            archive.addfile(info, io.BytesIO(payload))
        PY
        fi

        digest_name="${asset_name}.sha256"
        digest_path="${temporary_directory}/${digest_name}"
        if command -v shasum >/dev/null 2>&1; then
          digest="$(shasum -a 256 "${prepared_asset}" | awk '{print $1}')"
        else
          digest="$(sha256sum "${prepared_asset}" | awk '{print $1}')"
        fi
        printf '%s  %s\n' "${digest}" "${asset_name}" > "${digest_path}"

        api_url="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}"
        uploads_url="${GITHUB_SERVER_URL:-https://github.com}"
        if [[ "${uploads_url}" == "https://github.com" ]]; then
          uploads_url="https://uploads.github.com/repos/${GITHUB_REPOSITORY}"
        else
          uploads_url="${api_url}"
        fi
        api_headers=(
          --header "Authorization: Bearer ${GH_TOKEN}"
          --header "Accept: application/vnd.github+json"
          --header "X-GitHub-Api-Version: 2022-11-28"
        )

        find_release() {
          curl --fail-with-body --silent --show-error "${api_headers[@]}" \
            "${api_url}/releases?per_page=100" | \
            python3 -c 'import json,sys; tag=sys.argv[1]; matches=[item for item in json.load(sys.stdin) if item.get("tag_name")==tag]; matches or sys.exit(1); json.dump(matches[0],sys.stdout)' "${tag}"
        }

        if ! release_payload="$(find_release)"; then
          create_payload="$(python3 - "${tag}" "${EVIDENCE_COMMIT_SHA}" "${DRAFT_RELEASE}" "${GITHUB_REPOSITORY}" <<'PY'
        import json
        import sys
        tag, commit_sha, draft, repository = sys.argv[1:]
        json.dump({
            'tag_name': tag,
            'target_commitish': commit_sha,
            'name': f'CI evidence {commit_sha}',
            'body': f'Canonical immutable evidence for {repository}@{commit_sha}.',
            'draft': draft == 'true',
            'prerelease': False,
        }, sys.stdout)
        PY
          )"
          if ! release_payload="$(curl --fail-with-body --silent --show-error "${api_headers[@]}" \
            --header "Content-Type: application/json" \
            --request POST --data-binary "${create_payload}" "${api_url}/releases")"; then
            release_payload="$(find_release)"
          fi
        fi

        target_commitish="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["target_commitish"])' <<< "${release_payload}")"
        [[ "${target_commitish}" == "${EVIDENCE_COMMIT_SHA}" ]] || {
          echo "Existing evidence release is not bound to ${EVIDENCE_COMMIT_SHA}: ${target_commitish}" >&2
          exit 1
        }
        release_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "${release_payload}")"

        upload_immutable() {
          local source_file="$1" upload_name="$2" existing_directory asset_id encoded_name
          existing_directory="${temporary_directory}/existing-${upload_name}"
          find_asset_id() {
            curl --fail-with-body --silent --show-error "${api_headers[@]}" \
              "${api_url}/releases/${release_id}/assets?per_page=100" | \
              python3 -c 'import json,sys; name=sys.argv[1]; matches=[item for item in json.load(sys.stdin) if item.get("name")==name]; print(matches[0]["id"]) if matches else sys.exit(1)' "${upload_name}"
          }
          if asset_id="$(find_asset_id 2>/dev/null)"; then
            mkdir -p "${existing_directory}"
            curl --fail-with-body --silent --show-error --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/octet-stream" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "${existing_directory}/${upload_name}" \
              "${api_url}/releases/assets/${asset_id}"
            cmp "${source_file}" "${existing_directory}/${upload_name}" || {
              echo "Refusing to replace differing immutable asset: ${upload_name}" >&2
              exit 1
            }
            echo "Immutable asset already exists and is identical: ${upload_name}"
          else
            encoded_name="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "${upload_name}")"
            if curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Content-Type: application/octet-stream" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --request POST --data-binary "@${source_file}" \
              "${uploads_url}/releases/${release_id}/assets?name=${encoded_name}" >/dev/null; then
              return 0
            fi
            mkdir -p "${existing_directory}"
            asset_id="$(find_asset_id)"
            curl --fail-with-body --silent --show-error --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/octet-stream" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "${existing_directory}/${upload_name}" \
              "${api_url}/releases/assets/${asset_id}"
            cmp "${source_file}" "${existing_directory}/${upload_name}" || {
              echo "Concurrent immutable asset differs: ${upload_name}" >&2
              exit 1
            }
          fi
        }

        upload_immutable "${prepared_asset}" "${asset_name}"
        upload_immutable "${digest_path}" "${digest_name}"
