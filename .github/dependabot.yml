version: 2
updates:
  # Project is feature-frozen at 1.0.0. Routine version-update PRs are disabled.
  # GitHub security updates remain available for critical vulnerability fixes.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 0
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 0
    labels:
      - dependencies
