name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests
    runs-on:
      - self-hosted
      - fast
    timeout-minutes: 20
    env:
      # Existing handler tests exercise the explicitly public test fixture.
      # Production remains closed by default in .env.example/config.py.
      PUBLIC_ACCESS_ENABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate shell scripts
        run: bash -n scripts/install_vds.sh scripts/backup_data.sh

      - name: Create isolated Python environment
        run: |
          python3 --version
          python3 -m venv .venv-ci
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          bot.py config.py restart_bot.py run_fvg_soak.py
          run_fvg_quality_backtest.py download_bitunix_history.py
          alerts database exchanges handlers operations research scripts tests

      - name: Run unit tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/trading-assistant-mpl
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results.txt

      - name: Run bounded pipeline soak
        run: |
          python run_fvg_soak.py \
            --database "${RUNNER_TEMP}/fvg-soak.sqlite3" \
            --events 500 \
            --recipients 10 \
            --batch-size 50 \
            --max-seconds 180 \
            --max-peak-memory-mb 256 \
            --reset \
            --output soak-report.json

      - name: Run recent Bitunix research smoke
        continue-on-error: true
        shell: bash
        run: |
          START=$(python -c 'from datetime import datetime,timedelta,timezone; print((datetime.now(timezone.utc)-timedelta(days=30)).isoformat())')
          END=$(python -c 'from datetime import datetime,timedelta,timezone; print((datetime.now(timezone.utc)-timedelta(minutes=15)).isoformat())')
          python download_bitunix_history.py \
            --symbol BTCUSDT \
            --interval 15m \
            --start "$START" \
            --end "$END" \
            --output recent-btcusdt-15m.csv
          python run_fvg_quality_backtest.py \
            --data-file recent-btcusdt-15m.csv \
            --symbol BTCUSDT \
            --horizons 1,4,16,96 \
            --output recent-fvg-quality.json

      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-output
          path: |
            test-results.txt
            soak-report.json
            recent-fvg-quality.json
          if-no-files-found: ignore
          retention-days: 7

  vds-linux-verification:
    name: Linux VDS systemd verification
    runs-on:
      - self-hosted
      - linux
      - fast
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify Linux and systemd tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          command -v systemd-analyze
          systemd-analyze --version

      - name: Render and verify production units
        shell: bash
        run: |
          set -euo pipefail
          sandbox="${RUNNER_TEMP}/fvg-vds-unit-verify"
          install_dir="${sandbox}/opt/fvg-alert-bot"
          state_dir="${sandbox}/var/lib/fvg-alert-bot"
          backup_dir="${sandbox}/var/backups/fvg-alert-bot"
          env_file="${sandbox}/etc/fvg-alert-bot.env"
          unit_dir="${sandbox}/units"

          mkdir -p \
            "${install_dir}/.venv/bin" \
            "${install_dir}/scripts" \
            "${state_dir}" \
            "${backup_dir}" \
            "$(dirname "${env_file}")" \
            "${unit_dir}"
          printf '#!/usr/bin/env bash\nexit 0\n' \
            > "${install_dir}/.venv/bin/python"
          chmod +x "${install_dir}/.venv/bin/python"
          cp scripts/backup_data.sh "${install_dir}/scripts/backup_data.sh"
          chmod +x "${install_dir}/scripts/backup_data.sh"
          touch "${install_dir}/bot.py"
          printf 'TELEGRAM_TOKEN=ci-placeholder\n' > "${env_file}"

          python3 scripts/render_systemd_units.py \
            --installer scripts/install_vds.sh \
            --output "${unit_dir}" \
            --service-user "$(id -un)" \
            --service-group "$(id -gn)" \
            --install-dir "${install_dir}" \
            --state-dir "${state_dir}" \
            --env-file "${env_file}" \
            --backup-dir "${backup_dir}"

          systemd-analyze verify \
            "${unit_dir}/fvg-alert-bot.service" \
            "${unit_dir}/fvg-alert-bot-backup.service" \
            "${unit_dir}/fvg-alert-bot-backup.timer"

          grep -F 'ProtectSystem=strict' \
            "${unit_dir}/fvg-alert-bot.service"
          grep -F 'ReadWritePaths='"${state_dir}" \
            "${unit_dir}/fvg-alert-bot.service"
          grep -F 'WantedBy=multi-user.target' \
            "${unit_dir}/fvg-alert-bot.service"
          grep -F 'Persistent=true' \
            "${unit_dir}/fvg-alert-bot-backup.timer"
