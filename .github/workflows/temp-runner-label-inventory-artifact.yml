name: Temporary runner label inventory artifact
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  inventory:
    if: github.head_ref == 'agent/runner-label-policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build runner inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' >/dev/null 2>&1
          python3 .github/scripts/temp_runner_inventory.py | tee runner-inventory.txt
      - uses: actions/upload-artifact@v4
        with:
          name: runner-label-inventory
          path: runner-inventory.txt
          retention-days: 1
