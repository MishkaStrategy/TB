name: Runner selector policy

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/check_runner_selectors.py"
      - ".github/RUNNER_LABELS.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/scripts/check_runner_selectors.py"
      - ".github/RUNNER_LABELS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate exact runner selectors
    runs-on: [self-hosted, fast]
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enforce runner selector allowlist
        run: python3 .github/scripts/check_runner_selectors.py
