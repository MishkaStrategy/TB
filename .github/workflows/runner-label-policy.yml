name: Runner label policy

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate self-hosted runner labels
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7"

      - name: Enforce capability labels
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import sys
          import yaml

          workflows = Path(".github/workflows")
          errors = []
          warnings = []

          def labels_from(value):
              if isinstance(value, str):
                  return [value.strip()]
              if isinstance(value, list):
                  return [str(item).strip() for item in value]
              if isinstance(value, dict):
                  return labels_from(value.get("labels", []))
              return []

          def runs_on_blocks(text):
              lines = text.splitlines()
              for index, line in enumerate(lines):
                  match = re.match(r"^(?P<indent> *)runs-on\s*:", line)
                  if not match:
                      continue

                  indent = len(match.group("indent"))
                  block = [line[indent:]]
                  cursor = index + 1

                  while cursor < len(lines):
                      candidate = lines[cursor]
                      if not candidate.strip():
                          block.append("")
                          cursor += 1
                          continue

                      candidate_indent = len(candidate) - len(
                          candidate.lstrip(" ")
                      )
                      if candidate_indent <= indent:
                          break

                      block.append(candidate[indent:])
                      cursor += 1

                  yield index + 1, "\n".join(block)

          for workflow_file in sorted(workflows.glob("*.y*ml")):
              text = workflow_file.read_text(encoding="utf-8")

              for line_number, block in runs_on_blocks(text):
                  try:
                      parsed = yaml.safe_load(block) or {}
                      value = parsed.get("runs-on")
                  except Exception as exc:
                      warnings.append(
                          f"{workflow_file}:{line_number}: could not parse "
                          f"runs-on block: {exc}"
                      )
                      continue

                  labels = labels_from(value)
                  normalized = [label.lower() for label in labels]

                  if "self-hosted" not in normalized:
                      continue

                  capability_labels = [
                      label
                      for label in labels
                      if label.lower() != "self-hosted"
                  ]
                  if not capability_labels:
                      errors.append(
                          f"{workflow_file}:{line_number}: self-hosted requires "
                          "at least one capability label, for example "
                          "[self-hosted, fast], [self-hosted, docker], "
                          "or [self-hosted, macos]."
                      )

          for warning in warnings:
              print(f"::warning::{warning}")

          if errors:
              print("Runner label policy violations:")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)

          print("Runner label policy passed.")
          PY
