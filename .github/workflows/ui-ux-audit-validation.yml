name: UI UX audit validation

on:
  push:
    branches:
      - agent/ui-ux-telegram-audit-2026-08-11
  pull_request:
    branches:
      - agent/project-audit-optimization-2026-08-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ui-ux-audit:
    name: Telegram and Mini App UI audit
    runs-on: [self-hosted, fast]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          command -v python3
          python3 --version
          python3 -m venv "${RUNNER_TEMP}/tb-ui-audit-venv"
          "${RUNNER_TEMP}/tb-ui-audit-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/tb-ui-audit-venv/bin/python" -m pip install -r requirements.txt

      - name: Compile changed Python UI modules
        shell: bash
        run: >-
          "${RUNNER_TEMP}/tb-ui-audit-venv/bin/python" -m compileall -q
          bot.py
          handlers/menu.py
          handlers/settings.py
          handlers/start.py
          handlers/donate.py
          tests/test_ui_ux_audit.py

      - name: Run UI UX regression tests
        run: "${RUNNER_TEMP}/tb-ui-audit-venv/bin/python" -m unittest -v tests.test_ui_ux_audit

      - name: Verify Node.js toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v node
          command -v npm
          node --version
          npm --version

      - name: Typecheck and build Telegram Mini App
        working-directory: telegram-mini-app
        env:
          VITE_MOCK_MODE: "false"
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          test -f dist/index.html
