name: UI UX audit validation

on:
  push:
    branches:
      - agent/ui-ux-telegram-audit-2026-08-11
  pull_request:
    branches:
      - agent/project-audit-optimization-2026-08-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ui-ux-audit:
    name: Telegram and Mini App UI audit
    runs-on: [self-hosted, fast]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile changed Python UI modules
        run: >-
          python -m compileall -q
          bot.py
          handlers/menu.py
          handlers/settings.py
          handlers/start.py
          handlers/donate.py
          tests/test_ui_ux_audit.py

      - name: Run UI UX regression tests
        run: python -m unittest -v tests.test_ui_ux_audit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: telegram-mini-app/package-lock.json

      - name: Typecheck and build Telegram Mini App
        working-directory: telegram-mini-app
        env:
          VITE_MOCK_MODE: "false"
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          test -f dist/index.html
