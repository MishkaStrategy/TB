name: Finalize audit release metadata

on:
  push:
    branches:
      - agent/project-audit-optimization-2026-08-11

permissions:
  contents: write

jobs:
  finalize:
    runs-on: [self-hosted, fast]
    timeout-minutes: 10
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/project-audit-optimization-2026-08-11

      - name: Synchronize release 1.3.8 metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --prune
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('.')

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, text):
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')

          def show_main(path):
              return subprocess.check_output(
                  ['git', 'show', f'origin/main:{path}'], text=True
              )

          # VERSION is intentionally a new immutable patch after the already-published 1.3.7.
          write('VERSION', '1.3.8\n')

          # Restore canonical release history from main and prepend the audit patch.
          main_changelog = show_main('CHANGELOG.md')
          prefix = '# Changelog\n\n'
          assert main_changelog.startswith(prefix)
          audit_section = '''## 1.3.8 — 2026-08-11

          Patch-релиз по результатам аудита актуального `main` после `1.3.7`.

          ### Исправлено и оптимизировано

          - `FundingExchangeStore` гарантированно закрывает context-managed SQLite connections, а `journal_mode=WAL` больше не переустанавливается на каждом чтении;
          - смена funding exchange selection и сброс crossing-state выполняются одной транзакцией;
          - Telegram update hot path переиспользует один `UserActivityRegistry` вместо создания объекта на каждый update;
          - sync settings/admin storage Mini App вынесено из `aiohttp` event loop через worker threads;
          - `aiohttp.Application` использует typed `web.AppKey`, устраняя `NotAppKeyWarning`;
          - повреждённый saved instrument или отдельная некорректная ticker row больше не обрушает весь market overview;
          - SQLite connection lifecycle дополнительно защищён repository-wide regression-тестом;
          - GitHub Actions используют точный allowlist capability selectors; release/systemd проверки закреплены за `[self-hosted, Linux]`;
          - release publication проверяет наличие `sha256sum`, `tar` и `gh` до создания immutable assets;
          - сохранён hotfix `1.3.7`: bot startup не заменяет внешне настроенную Telegram Mini App Menu Button.

          ### Проверки и совместимость

          - Telegram/FVG/funding/Mini App API-контракты не меняются;
          - production env, SQLite/runtime-state, BotFather/Xray/port 443 автоматически не изменяются;
          - Mini App остаётся default-off и loopback-only;
          - релиз публикуется отдельным immutable tag `v1.3.8`; существующий `v1.3.7` не перемещается.
          '''
          audit_section = '\n'.join(line[10:] if line.startswith('          ') else line for line in audit_section.splitlines()).strip() + '\n\n'
          write('CHANGELOG.md', prefix + audit_section + main_changelog[len(prefix):])

          # Restore the historical 1.3.7 release note exactly from canonical main.
          write('docs/RELEASE_1.3.7.md', show_main('docs/RELEASE_1.3.7.md'))

          release_138 = '''# FVG Alert Bot 1.3.8

          `1.3.8` is an immutable reliability and performance patch release produced by a post-1.3.7 project audit. It preserves the `1.3.7` Telegram Mini App Menu Button hotfix while removing avoidable blocking I/O, tightening SQLite lifecycle handling, isolating malformed market rows and enforcing the project runner policy.

          ## Runtime reliability and performance

          - `FundingExchangeStore` closes context-managed SQLite connections and configures WAL once during store initialization instead of on every read;
          - funding exchange selection replacement and crossing-state reset are committed atomically;
          - Telegram update activity tracking reuses one process-wide `UserActivityRegistry`;
          - Mini App settings and synchronous admin storage operations run outside the aiohttp event-loop thread;
          - Mini App application state uses typed `aiohttp.web.AppKey` keys;
          - malformed persisted instruments or malformed exchange ticker rows no longer make the entire market overview unavailable;
          - repository-wide regression coverage rejects unsafe direct `with sqlite3.connect(...)` usage unless an explicit closing factory owns the lifecycle.

          ## Telegram Mini App compatibility

          Bot startup refreshes localized commands without changing the persistent Telegram Menu Button. The Mini App URL remains an external Bot API/BotFather deployment setting; `1.3.8` inherits and protects the `1.3.7` Menu Button fix.

          ## CI and release safety

          - self-hosted workflow routing is restricted to the documented exact selector allowlist;
          - fast checks use `[self-hosted, fast]`, Linux/systemd and release checks use `[self-hosted, Linux]`;
          - release publication preflights `sha256sum`, `tar` and `gh` on the Linux capability runner;
          - existing immutable tags, including `v1.3.7`, are never moved.

          ## Compatibility and production safety

          - no Telegram commands, FVG/funding contracts, Mini App API paths, schemas, BotFather settings or production environment values are changed;
          - `/etc/fvg-alert-bot.env`, `/var/lib/fvg-alert-bot`, SQLite databases and user settings are preserved;
          - Mini App remains opt-in and loopback-only by default (`MINI_APP_BACKEND_ENABLED=false`, `127.0.0.1:18080`);
          - public access remains fail-closed unless explicitly enabled.

          ## Verification contract

          Before publication, CI must verify the exact release commit with dependency audit, Python compilation, the full unit suite, Mini App backend regressions, frontend typecheck/build, runner selector policy, candidate environment isolation, backup checks, bounded notification soak and Linux systemd verification. A second exact-SHA CI and release-audit run is required before merge.

          ## Release archive

          The release workflow creates `fvg-alert-bot-1.3.8.tar.gz` and `fvg-alert-bot-1.3.8.tar.gz.sha256` only from the reviewed two-parent merge commit on `main`. Production deployment remains a separate guarded operation using the exact audited release SHA.
          '''
          release_138 = '\n'.join(line[10:] if line.startswith('          ') else line for line in release_138.splitlines()).strip() + '\n'
          write('docs/RELEASE_1.3.8.md', release_138)

          readme = read('README.md')
          replacements = {
              'version-1.3.7-': 'version-1.3.8-',
              'Текущий релиз: **1.3.7**.': 'Текущий релиз: **1.3.8**.',
              'Официальный `v1.3.7` содержит': 'Официальный `v1.3.8` содержит',
              'TARGET_REF=v1.3.7': 'TARGET_REF=v1.3.8',
              'EXPECTED_VERSION=1.3.7': 'EXPECTED_VERSION=1.3.8',
              'fvg-alert-bot-1.3.7.tar.gz': 'fvg-alert-bot-1.3.8.tar.gz',
          }
          for old, new in replacements.items():
              readme = readme.replace(old, new)
          release_link = '- [`docs/RELEASE_1.3.7.md`](docs/RELEASE_1.3.7.md);'
          if '- [`docs/RELEASE_1.3.8.md`](docs/RELEASE_1.3.8.md);' not in readme:
              assert release_link in readme
              readme = readme.replace(
                  release_link,
                  '- [`docs/RELEASE_1.3.8.md`](docs/RELEASE_1.3.8.md);\n' + release_link,
                  1,
              )
          write('README.md', readme)

          updater = read('scripts/update_vds.sh').replace('1.3.7', '1.3.8')
          write('scripts/update_vds.sh', updater)

          vds = read('docs/VDS_BOT_API_ONLY_UPDATE.md').replace('1.3.7', '1.3.8')
          history_marker = '`v1.3.6` remains an immutable release and must not be moved or rewritten.\n\n'
          assert history_marker in vds
          prior_note = '`v1.3.7` is the immutable Telegram Mini App Menu Button hotfix and must not be moved or rewritten.\n\n'
          if prior_note not in vds:
              vds = vds.replace(history_marker, history_marker + prior_note, 1)
          write('docs/VDS_BOT_API_ONLY_UPDATE.md', vds)

          release_audit = read('.github/workflows/release-audit.yml')
          release_audit = release_audit.replace('tests.test_release_1_3_7_contract', 'tests.test_release_1_3_8_contract')
          release_audit = release_audit.replace('1.3.7', '1.3.8')
          write('.github/workflows/release-audit.yml', release_audit)

          metadata_test = read('tests/test_release_metadata_consistency.py').replace(
              'tests.test_release_1_3_7_contract', 'tests.test_release_1_3_8_contract'
          )
          write('tests/test_release_metadata_consistency.py', metadata_test)

          current_contract = read('tests/test_release_1_3_0_contract.py')
          current_contract = current_contract.replace('Release137ContractTests', 'Release138ContractTests')
          current_contract = current_contract.replace('1.3.7', '1.3.8')
          write('tests/test_release_1_3_0_contract.py', current_contract)

          historical_137 = '''import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]


          class Release137HistoricalContractTests(unittest.TestCase):
              def test_release_document_and_changelog_are_preserved(self):
                  self.assertTrue((ROOT / "docs" / "RELEASE_1.3.7.md").is_file())
                  changelog = (ROOT / "CHANGELOG.md").read_text(encoding="utf-8")
                  self.assertIn("## 1.3.7", changelog)
                  release = (ROOT / "docs" / "RELEASE_1.3.7.md").read_text(encoding="utf-8")
                  self.assertIn("persistent Web App Menu Button", release)

              def test_menu_button_hotfix_remains_in_runtime(self):
                  bot = (ROOT / "bot.py").read_text(encoding="utf-8")
                  self.assertNotIn("set_chat_menu_button", bot)
                  self.assertNotIn("MenuButtonCommands", bot)
                  self.assertIn("set_my_commands", bot)


          if __name__ == "__main__":
              unittest.main()
          '''
          historical_137 = '\n'.join(line[10:] if line.startswith('          ') else line for line in historical_137.splitlines()).strip() + '\n'
          write('tests/test_release_1_3_7_contract.py', historical_137)

          contract_138 = '''import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]


          class Release138AuditContractTests(unittest.TestCase):
              def test_release_version_and_documents(self):
                  self.assertEqual((ROOT / "VERSION").read_text(encoding="utf-8").strip(), "1.3.8")
                  self.assertTrue((ROOT / "docs" / "RELEASE_1.3.8.md").is_file())
                  changelog = (ROOT / "CHANGELOG.md").read_text(encoding="utf-8")
                  self.assertIn("## 1.3.8", changelog)
                  self.assertIn("## 1.3.7", changelog)

              def test_runtime_audit_fixes_are_present(self):
                  funding_store = (ROOT / "alerts" / "funding_exchange_store.py").read_text(encoding="utf-8")
                  self.assertIn("class _ClosingConnection(sqlite3.Connection)", funding_store)
                  self.assertIn("factory=_ClosingConnection", funding_store)
                  self.assertIn('connection.execute("BEGIN IMMEDIATE")', funding_store)

                  bot = (ROOT / "bot.py").read_text(encoding="utf-8")
                  self.assertIn("USER_ACTIVITY_REGISTRY = UserActivityRegistry()", bot)
                  self.assertIn("USER_ACTIVITY_REGISTRY.touch", bot)
                  self.assertNotIn("set_chat_menu_button", bot)
                  self.assertNotIn("MenuButtonCommands", bot)

                  mini_app_web = (ROOT / "mini_app_backend" / "web.py").read_text(encoding="utf-8")
                  self.assertIn("web.AppKey", mini_app_web)
                  self.assertIn("await asyncio.to_thread", mini_app_web)

                  overview = (ROOT / "mini_app_backend" / "market_overview.py").read_text(encoding="utf-8")
                  self.assertIn("def _normalize_instruments", overview)
                  self.assertIn("def _ticker_index", overview)

              def test_runner_policy_is_exact_and_release_runs_on_linux(self):
                  checker = (ROOT / ".github" / "scripts" / "check_runner_selectors.py").read_text(encoding="utf-8")
                  for selector in (
                      "[self-hosted, fast]",
                      "[self-hosted, docker]",
                      "[self-hosted, backtester]",
                      "[self-hosted, Linux]",
                      "[self-hosted, macOS, ARM64]",
                  ):
                      self.assertIn(selector, checker)
                  release = (ROOT / ".github" / "workflows" / "release.yml").read_text(encoding="utf-8")
                  self.assertIn("runs-on: [self-hosted, Linux]", release)
                  self.assertIn("command -v sha256sum", release)
                  self.assertIn("command -v gh", release)

              def test_production_defaults_remain_fail_closed(self):
                  lifecycle = (ROOT / "mini_app_backend" / "lifecycle.py").read_text(encoding="utf-8")
                  config = (ROOT / "config.py").read_text(encoding="utf-8")
                  self.assertIn('default=False', lifecycle)
                  self.assertIn('"127.0.0.1"', lifecycle)
                  self.assertIn("PUBLIC_ACCESS_ENABLED = parse_bool", config)
                  self.assertIn("default=False", config)


          if __name__ == "__main__":
              unittest.main()
          '''
          contract_138 = '\n'.join(line[10:] if line.startswith('          ') else line for line in contract_138.splitlines()).strip() + '\n'
          write('tests/test_release_1_3_8_contract.py', contract_138)

          # Remove one-off synchronization/trigger helpers before final verification.
          for path in (
              '.github/workflows/audit-sync-main.yml',
              'docs/AUDIT_SECOND_RUN_TRIGGER.md',
              'docs/AUDIT_FINAL_CANDIDATE_2026-08-11.md',
          ):
              target = root / path
              if target.exists():
                  target.unlink()

          # The finalizer removes itself in the same commit, leaving only durable workflows.
          self_path = root / '.github/workflows/audit-release-finalizer.yml'
          if self_path.exists():
              self_path.unlink()

          # Sanity checks before committing.
          assert read('VERSION').strip() == '1.3.8'
          assert '## 1.3.8' in read('CHANGELOG.md')
          assert '## 1.3.7' in read('CHANGELOG.md')
          assert 'set_chat_menu_button' not in read('bot.py')
          assert 'MenuButtonCommands' not in read('bot.py')
          assert 'EXPECTED_VERSION="${EXPECTED_VERSION:-1.3.8}"' in read('scripts/update_vds.sh')
          assert 'tests.test_release_1_3_8_contract' in read('.github/workflows/release-audit.yml')
          PY

      - name: Commit finalized audit metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No metadata changes required."
            exit 0
          fi
          git commit -m "release: finalize audit patch 1.3.8"
          git push origin HEAD:agent/project-audit-optimization-2026-08-11
