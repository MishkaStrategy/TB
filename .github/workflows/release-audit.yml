name: Release audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-release-audit:
    name: Full CI and VDS release audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUBLIC_ACCESS_ENABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rsync
          command -v systemd-analyze

      - name: Validate shell and release metadata
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            scripts/install_vds.sh \
            scripts/run_candidate_tests.sh \
            scripts/backup_data.sh \
            scripts/update_vds.sh \
            scripts/update_vds_bot_api_only.sh
          test "$(tr -d '\r\n' < VERSION)" = "1.3.3"
          grep -F 'runs-on: ubuntu-latest' .github/workflows/release.yml
          grep -F 'git archive' .github/workflows/release.yml
          grep -F 'TARGET_REF="${TARGET_REF:-main}"' scripts/update_vds.sh
          grep -F 'EXPECTED_VERSION="${EXPECTED_VERSION:-1.3.3}"' scripts/update_vds.sh
          grep -F 'TELEGRAM_API_HASH' scripts/update_vds_bot_api_only.sh
          grep -F 'env -i' scripts/run_candidate_tests.sh
          test ! -e telegram-mini-app
          python -m unittest discover -s tests -p 'test_release_metadata_consistency.py' -v

      - name: Install and audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit
          audit_status=1
          for attempt in 1 2 3; do
            if pip-audit -r requirements.txt --progress-spinner off; then
              audit_status=0
              break
            else
              audit_status=$?
            fi
            if (( attempt < 3 )); then
              echo "pip-audit failed on attempt ${attempt}; retrying after transient-network backoff" >&2
              sleep $((attempt * 5))
            fi
          done
          exit "${audit_status}"

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          bot.py config.py restart_bot.py run_fvg_soak.py
          run_fvg_quality_backtest.py download_bitunix_history.py
          alerts database exchanges handlers operations research scripts tests

      - name: Verify 1.3.3 integration contract
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_release_1_3_0_contract.py' -v
          python -m unittest discover -s tests -p 'test_release_metadata_consistency.py' -v
          python -m unittest discover -s tests -p 'test_fvg_outbox_v2_policy.py' -v
          python -m unittest discover -s tests -p 'test_fvg_instruments.py' -v
          python -m unittest discover -s tests -p 'test_fvg_non_btc_15m_policy.py' -v
          python -m unittest discover -s tests -p 'test_admin_restart_guard_status.py' -v
          python -m unittest discover -s tests -p 'test_admin_fvg_archive_status.py' -v
          python -m unittest discover -s tests -p 'test_process_restart_guard.py' -v
          python -m unittest discover -s tests -p 'test_fvg_history_archive.py' -v

      - name: Verify VDS candidate isolation
        shell: bash
        env:
          MAX_SYMBOLS_PER_USER: "20"
          OUTBOX_RETRY_POLICY_ENABLED: "true"
          FVG_HISTORY_ARCHIVE_ENABLED: "true"
          TELEGRAM_TOKEN: must-not-leak
          ADMIN_TELEGRAM_IDS: "987654321"
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_candidate_test_isolation.py' -v

      - name: Run full unit suite
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/trading-assistant-mpl
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results.txt

      - name: Run bounded notification soak
        shell: bash
        run: |
          set -euo pipefail
          python run_fvg_soak.py \
            --database "${RUNNER_TEMP}/fvg-soak.sqlite3" \
            --events 500 \
            --recipients 10 \
            --batch-size 50 \
            --max-seconds 180 \
            --max-peak-memory-mb 256 \
            --reset \
            --output soak-report.json

      - name: Render and verify production systemd units
        shell: bash
        run: |
          set -euo pipefail
          sandbox="${RUNNER_TEMP}/fvg-vds-unit-verify"
          install_dir="${sandbox}/opt/fvg-alert-bot"
          state_dir="${sandbox}/var/lib/fvg-alert-bot"
          backup_dir="${sandbox}/var/backups/fvg-alert-bot"
          env_file="${sandbox}/etc/fvg-alert-bot.env"
          unit_dir="${sandbox}/units"

          mkdir -p \
            "${install_dir}/.venv/bin" \
            "${install_dir}/scripts" \
            "${state_dir}" \
            "${backup_dir}" \
            "$(dirname "${env_file}")" \
            "${unit_dir}"
          printf '#!/usr/bin/env bash\nexit 0\n' > "${install_dir}/.venv/bin/python"
          chmod +x "${install_dir}/.venv/bin/python"
          cp scripts/backup_data.sh "${install_dir}/scripts/backup_data.sh"
          chmod +x "${install_dir}/scripts/backup_data.sh"
          touch "${install_dir}/bot.py"
          printf 'TELEGRAM_TOKEN=ci-placeholder\n' > "${env_file}"

          python scripts/render_systemd_units.py \
            --installer scripts/install_vds.sh \
            --output "${unit_dir}" \
            --service-user "$(id -un)" \
            --service-group "$(id -gn)" \
            --install-dir "${install_dir}" \
            --state-dir "${state_dir}" \
            --env-file "${env_file}" \
            --backup-dir "${backup_dir}"

          systemd-analyze verify \
            "${unit_dir}/fvg-alert-bot.service" \
            "${unit_dir}/fvg-alert-bot-backup.service" \
            "${unit_dir}/fvg-alert-bot-backup.timer"
          grep -F 'ProtectSystem=strict' "${unit_dir}/fvg-alert-bot.service"
          grep -F 'ReadWritePaths='"${state_dir}" "${unit_dir}/fvg-alert-bot.service"
          grep -F 'MemoryMax=512M' "${unit_dir}/fvg-alert-bot.service"
          grep -F 'Persistent=true' "${unit_dir}/fvg-alert-bot-backup.timer"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-audit-evidence
          path: |
            test-results.txt
            soak-report.json
          if-no-files-found: ignore
          retention-days: 14
