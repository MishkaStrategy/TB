name: Release audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-release-audit:
    name: Full CI and VDS release audit
    runs-on: [self-hosted, Linux]
    timeout-minutes: 40
    env:
      PUBLIC_ACCESS_ENABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: telegram-mini-app/package-lock.json

      - name: Verify system verification tools
        shell: bash
        run: |
          set -euo pipefail
          command -v rsync
          command -v systemd-analyze
          systemd-analyze --version

      - name: Validate shell and release metadata
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            scripts/install_vds.sh \
            scripts/run_candidate_tests.sh \
            scripts/backup_data.sh \
            scripts/update_vds.sh \
            scripts/update_vds_bot_api_only.sh
          test "$(tr -d '\r\n' < VERSION)" = "1.3.6"
          test "$(git rev-parse 'v1.3.4^{commit}')" = "f568f2282435099e2b12718de45e4bbe802a0b79"
          test "$(git show 'v1.3.4:VERSION' | tr -d '\r\n')" = "1.3.4"
          test "$(git rev-parse 'v1.3.5^{commit}')" = "e9fdaae934a083b1f1bd054d6f0c8fff04776581"
          test "$(git show 'v1.3.5:VERSION' | tr -d '\r\n')" = "1.3.5"
          grep -F 'runs-on: [self-hosted, Linux]' .github/workflows/release.yml
          grep -F 'command -v sha256sum' .github/workflows/release.yml
          grep -F 'command -v gh' .github/workflows/release.yml
          grep -F 'git archive' .github/workflows/release.yml
          grep -F 'two-parent merge commit on main' .github/workflows/release.yml
          grep -F 'refusing to republish it from' .github/workflows/release.yml
          grep -F 'archive_missing' .github/workflows/release.yml
          if grep -F -- '--clobber' .github/workflows/release.yml; then
            echo 'release workflow must never clobber immutable assets' >&2
            exit 1
          fi
          grep -F 'TARGET_REF="${TARGET_REF:-main}"' scripts/update_vds.sh
          grep -F 'EXPECTED_VERSION="${EXPECTED_VERSION:-1.3.6}"' scripts/update_vds.sh
          grep -F 'TELEGRAM_API_HASH' scripts/update_vds_bot_api_only.sh
          grep -F 'env -i' scripts/run_candidate_tests.sh
          grep -F 'COPYFILE_DISABLE=1 tar' scripts/backup_data.sh
          test -f telegram-mini-app/package-lock.json
          test -f mini_app_backend/service.py
          test -f mini_app_backend/auth.py
          grep -F 'start_mini_app_backend' bot.py
          grep -F 'stop_mini_app_backend' bot.py
          grep -F 'default=False' mini_app_backend/lifecycle.py
          grep -F '127.0.0.1' mini_app_backend/lifecycle.py
          grep -F '18080' mini_app_backend/lifecycle.py
          grep -F 'MINI_APP_ALLOWED_ORIGINS' mini_app_backend/lifecycle.py
          grep -F 'hmac.compare_digest' mini_app_backend/auth.py
          grep -F 'VITE_MOCK_MODE' telegram-mini-app/src/api.ts
          grep -F '"false"' telegram-mini-app/src/api.ts
          grep -F '"/api/mini-app/settings"' telegram-mini-app/src/api.ts
          grep -F '"/api/mini-app/market-overview"' telegram-mini-app/src/api.ts
          grep -F '<TradingApp />' telegram-mini-app/src/main.tsx
          grep -F 'https://tbbot.mstrategy.com.ru' docs/VDS_BOT_API_ONLY_UPDATE.md
          test ! -e scripts/manage_tbbot_sni_router.sh
          test ! -e scripts/deploy_tbbot_mini_app.sh
          if grep -Eiq '(^|[<=>~ ])(telethon|pyrogram)([<=>~ ]|$)' requirements.txt; then
            echo 'Telethon/Pyrogram are forbidden in Bot API-only release dependencies' >&2
            exit 1
          fi
          python -m unittest -v \
            tests.test_release_metadata_consistency \
            tests.test_release_1_3_6_contract \
            tests.test_vds_bot_api_only_update

      - name: Install and audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit
          audit_status=1
          for attempt in 1 2 3; do
            if pip-audit -r requirements.txt --progress-spinner off; then
              audit_status=0
              break
            else
              audit_status=$?
            fi
            if (( attempt < 3 )); then
              echo "pip-audit failed on attempt ${attempt}; retrying after transient-network backoff" >&2
              sleep $((attempt * 5))
            fi
          done
          exit "${audit_status}"

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          bot.py config.py restart_bot.py
          alerts database exchanges handlers operations
          mini_app_backend scripts tests

      - name: Verify Mini App and release regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_mini_app_auth \
            tests.test_mini_app_service \
            tests.test_mini_app_web \
            tests.test_mini_app_runtime_service \
            tests.test_mini_app_admin_actions \
            tests.test_mini_app_admin_web \
            tests.test_release_metadata_consistency \
            tests.test_release_1_3_0_contract \
            tests.test_release_1_3_6_contract \
            tests.test_vds_bot_api_only_update

      - name: Verify VDS candidate isolation
        shell: bash
        env:
          MAX_SYMBOLS_PER_USER: "20"
          OUTBOX_RETRY_POLICY_ENABLED: "true"
          FVG_HISTORY_ARCHIVE_ENABLED: "true"
          TELEGRAM_TOKEN: must-not-leak
          ADMIN_TELEGRAM_IDS: "987654321"
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_candidate_test_isolation.py' -v

      - name: Build and audit production Mini App frontend
        working-directory: telegram-mini-app
        shell: bash
        env:
          VITE_MOCK_MODE: "false"
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          test -f dist/index.html
          grep -R -F '/api/mini-app/settings' dist
          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo 'Production frontend must not publish source maps' >&2
            exit 1
          fi
          if grep -R -E 'TELEGRAM_TOKEN|TELEGRAM_API_ID|TELEGRAM_API_HASH|API_ID|API_HASH' dist; then
            echo 'Production frontend bundle contains forbidden Telegram credential identifiers' >&2
            exit 1
          fi

      - name: Run full unit suite
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/trading-assistant-mpl
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results.txt

      - name: Run backup contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_backup_data \
            tests.test_backup_audit \
            tests.test_backup_checksum_binding

      - name: Run bounded notification soak
        shell: bash
        run: |
          set -euo pipefail
          python run_fvg_soak.py \
            --database "${RUNNER_TEMP}/fvg-soak-1.3.6.sqlite3" \
            --events 500 \
            --recipients 10 \
            --batch-size 50 \
            --max-seconds 180 \
            --max-peak-memory-mb 256 \
            --reset \
            --output soak-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('soak-report.json').read_text(encoding='utf-8'))
          assert report['events_requested'] == 500, report
          assert report['events_persisted'] == 500, report
          assert report['expected_deliveries'] == 5000, report
          assert report['deliveries_persisted'] == 5000, report
          assert report['bot_messages'] == 5000, report
          assert report['outbox_remaining'] == 0, report
          assert report['passed'] is True, report
          assert report['failures'] == [], report
          PY

      - name: Render and verify production systemd units
        shell: bash
        run: |
          set -euo pipefail
          sandbox="${RUNNER_TEMP}/fvg-vds-unit-verify"
          install_dir="${sandbox}/opt/fvg-alert-bot"
          state_dir="${sandbox}/var/lib/fvg-alert-bot"
          backup_dir="${sandbox}/var/backups/fvg-alert-bot"
          env_file="${sandbox}/etc/fvg-alert-bot.env"
          unit_dir="${sandbox}/units"

          mkdir -p \
            "${install_dir}/.venv/bin" \
            "${install_dir}/scripts" \
            "${state_dir}" \
            "${backup_dir}" \
            "$(dirname "${env_file}")" \
            "${unit_dir}"
          printf '#!/usr/bin/env bash\nexit 0\n' > "${install_dir}/.venv/bin/python"
          chmod +x "${install_dir}/.venv/bin/python"
          cp scripts/backup_data.sh "${install_dir}/scripts/backup_data.sh"
          chmod +x "${install_dir}/scripts/backup_data.sh"
          touch "${install_dir}/bot.py"
          printf 'TELEGRAM_TOKEN=ci-placeholder\n' > "${env_file}"

          python scripts/render_systemd_units.py \
            --installer scripts/install_vds.sh \
            --output "${unit_dir}" \
            --service-user "$(id -un)" \
            --service-group "$(id -gn)" \
            --install-dir "${install_dir}" \
            --state-dir "${state_dir}" \
            --env-file "${env_file}" \
            --backup-dir "${backup_dir}"

          systemd-analyze verify \
            "${unit_dir}/fvg-alert-bot.service" \
            "${unit_dir}/fvg-alert-bot-backup.service" \
            "${unit_dir}/fvg-alert-bot-backup.timer"
          grep -F 'ProtectSystem=strict' "${unit_dir}/fvg-alert-bot.service"
          grep -F 'ReadWritePaths='"${state_dir}" "${unit_dir}/fvg-alert-bot.service"
          grep -F 'MemoryMax=512M' "${unit_dir}/fvg-alert-bot.service"
          grep -F 'Persistent=true' "${unit_dir}/fvg-alert-bot-backup.timer"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-audit-evidence
          path: |
            test-results.txt
            soak-report.json
          if-no-files-found: ignore
          retention-days: 14
