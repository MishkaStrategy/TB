name: Restart stuck self-hosted Actions

on:
  push:
    branches:
      - ops/restart-stuck-actions-20260728
    paths:
      - .github/workflows/restart-stuck-self-hosted.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/restart-stuck-self-hosted.yml

permissions:
  actions: write
  contents: read
  statuses: write

jobs:
  restart:
    name: Cancel and rerun stale self-hosted runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restart stale runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = Number(context.runId);
            const now = Date.now();
            const queuedCutoffMs = 2 * 60 * 1000;
            const runningCutoffMs = 30 * 60 * 1000;
            const historyCutoffMs = 72 * 60 * 60 * 1000;
            const candidates = [];
            const failures = [];

            const activeRuns = [];
            for (const status of ['queued', 'in_progress']) {
              for (let page = 1; page <= 10; page += 1) {
                const response = await github.request('GET /repos/{owner}/{repo}/actions/runs', {
                  owner,
                  repo,
                  status,
                  per_page: 100,
                  page,
                });
                const runs = response.data.workflow_runs || [];
                activeRuns.push(...runs);
                if (runs.length < 100) break;
              }
            }

            const uniqueRuns = [...new Map(activeRuns.map((run) => [Number(run.id), run])).values()]
              .filter((run) => Number(run.id) !== currentRunId)
              .filter((run) => now - Date.parse(run.created_at) <= historyCutoffMs);

            for (let index = 0; index < uniqueRuns.length; index += 20) {
              const batch = uniqueRuns.slice(index, index + 20);
              const inspected = await Promise.all(batch.map(async (run) => {
                const jobsResponse = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs', {
                  owner,
                  repo,
                  run_id: run.id,
                  filter: 'latest',
                  per_page: 100,
                });
                const staleJobs = (jobsResponse.data.jobs || []).filter((job) => {
                  const labels = (job.labels || []).map((label) => String(label).toLowerCase());
                  if (!labels.includes('self-hosted')) return false;
                  if (job.status === 'queued') {
                    return now - Date.parse(run.created_at) >= queuedCutoffMs;
                  }
                  if (job.status === 'in_progress') {
                    const startedAt = job.started_at || run.run_started_at || run.created_at;
                    return now - Date.parse(startedAt) >= runningCutoffMs;
                  }
                  return false;
                });
                return staleJobs.length === 0 ? null : {
                  id: Number(run.id),
                  name: run.name,
                  jobs: staleJobs.map((job) => `${job.name} (${job.status})`),
                };
              }));
              candidates.push(...inspected.filter(Boolean));
            }

            const uniqueCandidates = [...new Map(candidates.map((run) => [run.id, run])).values()];
            const cancelled = [];

            const cancelResults = await Promise.allSettled(uniqueCandidates.map(async (run) => {
              await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/cancel', {
                owner,
                repo,
                run_id: run.id,
              });
              cancelled.push(run);
            }));

            cancelResults.forEach((result, index) => {
              if (result.status === 'rejected') {
                failures.push({ ...uniqueCandidates[index], error: `cancel: ${result.reason.message}` });
              }
            });

            const pending = new Map(cancelled.map((run) => [run.id, run]));
            for (let attempt = 0; attempt < 40 && pending.size > 0; attempt += 1) {
              await new Promise((resolve) => setTimeout(resolve, 3000));
              const checks = await Promise.all([...pending.values()].map(async (run) => {
                const response = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}', {
                  owner,
                  repo,
                  run_id: run.id,
                });
                return { run, status: response.data.status };
              }));
              for (const check of checks) {
                if (check.status === 'completed') pending.delete(check.run.id);
              }
            }

            for (const run of pending.values()) {
              failures.push({ ...run, error: 'cancel timeout' });
            }

            const ready = cancelled.filter((run) => !pending.has(run.id));
            const restarted = [];
            const rerunResults = await Promise.allSettled(ready.map(async (run) => {
              await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun', {
                owner,
                repo,
                run_id: run.id,
              });
              restarted.push(run);
            }));

            rerunResults.forEach((result, index) => {
              if (result.status === 'rejected') {
                failures.push({ ...ready[index], error: `rerun: ${result.reason.message}` });
              }
            });

            const jobCount = restarted.reduce((total, run) => total + run.jobs.length, 0);
            const description = failures.length === 0
              ? `Restarted ${restarted.length} runs / ${jobCount} self-hosted jobs`
              : `Restarted ${restarted.length}; failed ${failures.length}`;

            await github.request('POST /repos/{owner}/{repo}/statuses/{sha}', {
              owner,
              repo,
              sha: context.sha,
              state: failures.length === 0 ? 'success' : 'failure',
              context: 'ops/restart-stuck-actions',
              description: description.slice(0, 140),
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${currentRunId}`,
            });

            await core.summary
              .addHeading('Restart stuck self-hosted Actions')
              .addRaw(`Found: ${uniqueCandidates.length}; restarted: ${restarted.length}; failures: ${failures.length}.`)
              .addTable([
                [{ data: 'Run', header: true }, { data: 'Jobs', header: true }, { data: 'Result', header: true }],
                ...restarted.map((run) => [run.name, run.jobs.join('<br>'), 'restarted']),
                ...failures.map((run) => [run.name, run.jobs.join('<br>'), `failed: ${run.error}`]),
              ])
              .write();

            if (failures.length > 0) core.setFailed(description);
