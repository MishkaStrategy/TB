name: Prepare audit release 1.3.8

on:
  push:
    branches:
      - agent/project-audit-optimization-2026-08-11
    paths:
      - ".github/workflows/audit-release-bump.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: [self-hosted, fast]
    timeout-minutes: 10
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/project-audit-optimization-2026-08-11

      - name: Synchronize release 1.3.8 metadata and contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          version = '1.3.8'
          previous = '1.3.7'

          (root / 'VERSION').write_text(version + '\n', encoding='utf-8')

          updater = root / 'scripts/update_vds.sh'
          text = updater.read_text(encoding='utf-8')
          text = text.replace('TARGET_REF=v1.3.7 EXPECTED_VERSION=1.3.7', 'TARGET_REF=v1.3.8 EXPECTED_VERSION=1.3.8')
          text = text.replace('EXPECTED_VERSION="${EXPECTED_VERSION:-1.3.7}"', 'EXPECTED_VERSION="${EXPECTED_VERSION:-1.3.8}"')
          updater.write_text(text, encoding='utf-8')

          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          replacements = {
              'version-1.3.7-': 'version-1.3.8-',
              'Текущий релиз: **1.3.7**': 'Текущий релиз: **1.3.8**',
              'Официальный `v1.3.7`': 'Официальный `v1.3.8`',
              'test "$(cat VERSION)" = "1.3.7"': 'test "$(cat VERSION)" = "1.3.8"',
              'Обновление существующего VDS до 1.3.7': 'Обновление существующего VDS до 1.3.8',
              'TARGET_REF=v1.3.7': 'TARGET_REF=v1.3.8',
              'EXPECTED_VERSION=1.3.7': 'EXPECTED_VERSION=1.3.8',
              'fvg-alert-bot-1.3.7.tar.gz': 'fvg-alert-bot-1.3.8.tar.gz',
              'Ожидается версия `1.3.7`': 'Ожидается версия `1.3.8`',
              'Release workflow для версии 1.3.7': 'Release workflow для версии 1.3.8',
              'создаёт `v1.3.7`': 'создаёт `v1.3.8`',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          release_link = '- [`docs/RELEASE_1.3.8.md`](docs/RELEASE_1.3.8.md);\n'
          marker = '- [`docs/RELEASE_1.3.7.md`](docs/RELEASE_1.3.7.md);\n'
          if release_link not in text and marker in text:
              text = text.replace(marker, release_link + marker, 1)
          current_line = 'Текущий релиз: **1.3.8**.'
          if current_line in text and 'аудита надёжности' not in text.split(current_line, 1)[1][:500]:
              text = text.replace(
                  current_line,
                  current_line + ' Это patch-релиз аудита надёжности и производительности: закрыты SQLite connection leaks, снижено блокирование event loop, оптимизирован WAL hot path и ужесточена политика CI runners.',
                  1,
              )
          readme.write_text(text, encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          text = changelog.read_text(encoding='utf-8')
          section = '''## 1.3.8 — 2026-08-11\n\nPatch-релиз по результатам аудита актуального `main` после `1.3.7`.\n\n### Исправлено и оптимизировано\n\n- `FundingExchangeStore` гарантированно закрывает SQLite connections; смена funding exchange selection и сброс crossing-state выполняются атомарно;\n- persistent `PRAGMA journal_mode=WAL` перенесён из hot-path соединений основных FVG/funding stores в одноразовую инициализацию базы;\n- Telegram update hot path переиспользует process-wide `UserActivityRegistry`;\n- Mini App settings/admin storage выполняется вне `aiohttp` event loop, application state использует typed `web.AppKey`;\n- malformed saved instruments и ticker rows изолируются и больше не обрушивают весь market overview;\n- закрыты read-only SQLite leaks в Mini App diagnostics/settings/admin helpers и добавлен repository-wide AST guard;\n- GitHub Actions ограничены точным allowlist self-hosted capability selectors; Linux/systemd/release jobs выполняются на `[self-hosted, Linux]`;\n- release publication проверяет наличие `sha256sum`, `tar` и `gh` перед созданием immutable assets;\n- сохранён fix `1.3.7`, не позволяющий `/start` и startup-конфигурации перезаписывать Telegram Mini App menu button.\n\n### Совместимость\n\n- Telegram/FVG/funding/Mini App API contracts не меняются;\n- Mini App остаётся default-off и loopback-only; public access и operational feature flags остаются fail-closed/default-off;\n- production env, SQLite/runtime-state, BotFather/Xray/port 443 автоматически не изменяются;\n- `v1.3.7` остаётся immutable, аудит публикуется отдельным tag `v1.3.8`.\n\n'''
          if '## 1.3.8 ' not in text:
              text = text.replace('# Changelog\n\n', '# Changelog\n\n' + section, 1)
          changelog.write_text(text, encoding='utf-8')

          release_doc = root / 'docs/RELEASE_1.3.8.md'
          release_doc.write_text('''# FVG Alert Bot 1.3.8\n\n`1.3.8` is an immutable reliability and performance patch release produced by an audit of the post-`1.3.7` codebase. It preserves the Telegram Mini App menu-button fix from `1.3.7` and keeps existing Telegram/FVG/funding/Mini App contracts stable.\n\n## Runtime reliability and performance\n\n- SQLite connections in funding exchange selection and read-only Mini App/admin diagnostics are explicitly closed;\n- funding exchange selection replacement and crossing reset are one transaction;\n- persistent WAL mode is configured during database initialization rather than every hot-path connection;\n- Telegram update activity tracking reuses one process-wide registry;\n- synchronous Mini App settings/admin storage is kept off the aiohttp event loop;\n- typed `aiohttp.web.AppKey` removes untyped application-state warnings;\n- malformed persisted instruments or exchange ticker rows fail soft per row instead of taking down the market overview.\n\n## CI and release safety\n\n- workflow `runs-on` values are restricted to the exact approved self-hosted selector allowlist;\n- fast checks use `[self-hosted, fast]`; Linux/systemd/release verification uses `[self-hosted, Linux]`;\n- release publication preflights `sha256sum`, `tar` and `gh`;\n- SQLite context-manager hygiene is enforced repository-wide by AST regression tests;\n- dependency audit, compilation, full unit suite, frontend build/typecheck, backup checks, bounded notification soak and Linux systemd verification are release gates.\n\n## Compatibility and production safety\n\n- the `1.3.7` Telegram Mini App menu button preservation remains intact; `/start` and startup configuration do not replace an existing `MenuButtonWebApp`;\n- Mini App remains opt-in and loopback-only by default;\n- public access remains fail-closed unless explicitly enabled;\n- `/etc/fvg-alert-bot.env`, `/var/lib/fvg-alert-bot`, SQLite databases and user settings are preserved;\n- existing immutable tags, including `v1.3.7`, are never moved;\n- production VDS deployment remains a separate guarded operation after release publication.\n\n## Release archive\n\nThe release workflow creates `fvg-alert-bot-1.3.8.tar.gz` and `fvg-alert-bot-1.3.8.tar.gz.sha256` from the reviewed merge commit on `main`.\n''', encoding='utf-8')

          vds = root / 'docs/VDS_BOT_API_ONLY_UPDATE.md'
          text = vds.read_text(encoding='utf-8')
          replacements = {
              '## Update to 1.3.7': '## Update to 1.3.8',
              'TARGET_REF=v1.3.7': 'TARGET_REF=v1.3.8',
              'EXPECTED_VERSION=1.3.7': 'EXPECTED_VERSION=1.3.8',
              'installed version is `1.3.7`': 'installed version is `1.3.8`',
              '## 1.3.7 smoke checks': '## 1.3.8 smoke checks',
              'FVG 1.3.7 production contract': 'FVG 1.3.8 production contract',
              'official `v1.3.7` source archive': 'official `v1.3.8` source archive',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          history_marker = '`v1.3.7` is the next immutable patch release.'
          if history_marker in text:
              text = text.replace(
                  history_marker,
                  '`v1.3.7` is an immutable Telegram Mini App menu-button patch release.\n\n`v1.3.8` is the next immutable audit patch release.',
                  1,
              )
          vds.write_text(text, encoding='utf-8')

          audit = root / '.github/workflows/release-audit.yml'
          text = audit.read_text(encoding='utf-8')
          text = text.replace('= "1.3.7"', '= "1.3.8"')
          text = text.replace('EXPECTED_VERSION="${EXPECTED_VERSION:-1.3.7}"', 'EXPECTED_VERSION="${EXPECTED_VERSION:-1.3.8}"')
          text = text.replace('tests.test_release_1_3_7_contract', 'tests.test_release_1_3_8_contract')
          text = text.replace('fvg-soak-1.3.7.sqlite3', 'fvg-soak-1.3.8.sqlite3')
          audit.write_text(text, encoding='utf-8')

          active_contract = root / 'tests/test_release_1_3_0_contract.py'
          text = active_contract.read_text(encoding='utf-8')
          text = text.replace('Release137ContractTests', 'Release138ContractTests')
          text = text.replace('"1.3.7"', '"1.3.8"')
          text = text.replace('1.3.7}', '1.3.8}')
          text = text.replace('v1.3.7 EXPECTED_VERSION=1.3.7', 'v1.3.8 EXPECTED_VERSION=1.3.8')
          active_contract.write_text(text, encoding='utf-8')

          metadata = root / 'tests/test_release_metadata_consistency.py'
          text = metadata.read_text(encoding='utf-8')
          text = text.replace('tests.test_release_1_3_7_contract', 'tests.test_release_1_3_8_contract')
          metadata.write_text(text, encoding='utf-8')

          historical = root / 'tests/test_release_1_3_7_contract.py'
          historical.write_text('''import unittest\nfrom pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\n\n\nclass Release137HistoricalContractTests(unittest.TestCase):\n    def test_release_document_is_retained(self):\n        self.assertTrue((ROOT / "docs" / "RELEASE_1.3.7.md").is_file())\n        self.assertIn("## 1.3.7", (ROOT / "CHANGELOG.md").read_text(encoding="utf-8"))\n\n    def test_mini_app_menu_button_preservation_remains_in_bot(self):\n        bot = (ROOT / "bot.py").read_text(encoding="utf-8")\n        self.assertIn("MenuButtonWebApp", bot)\n        self.assertIn("get_chat_menu_button", bot)\n        self.assertIn("MenuButtonCommands", bot)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          contract = root / 'tests/test_release_1_3_8_contract.py'
          contract.write_text('''import unittest\nfrom pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\n\n\nclass Release138AuditContractTests(unittest.TestCase):\n    def test_release_version_and_documents(self):\n        self.assertEqual((ROOT / "VERSION").read_text(encoding="utf-8").strip(), "1.3.8")\n        self.assertTrue((ROOT / "docs" / "RELEASE_1.3.8.md").is_file())\n        self.assertIn("## 1.3.8", (ROOT / "CHANGELOG.md").read_text(encoding="utf-8"))\n\n    def test_runtime_audit_fixes_are_present(self):\n        funding_store = (ROOT / "alerts" / "funding_exchange_store.py").read_text(encoding="utf-8")\n        self.assertIn("class _ClosingConnection(sqlite3.Connection)", funding_store)\n        self.assertIn("factory=_ClosingConnection", funding_store)\n        self.assertIn('connection.execute("BEGIN IMMEDIATE")', funding_store)\n\n        bot = (ROOT / "bot.py").read_text(encoding="utf-8")\n        self.assertIn("USER_ACTIVITY_REGISTRY = UserActivityRegistry()", bot)\n        self.assertIn("USER_ACTIVITY_REGISTRY.touch", bot)\n        self.assertIn("MenuButtonWebApp", bot)\n        self.assertIn("get_chat_menu_button", bot)\n\n        mini_app_web = (ROOT / "mini_app_backend" / "web.py").read_text(encoding="utf-8")\n        self.assertIn("web.AppKey", mini_app_web)\n        self.assertIn("await asyncio.to_thread", mini_app_web)\n\n        overview = (ROOT / "mini_app_backend" / "market_overview.py").read_text(encoding="utf-8")\n        self.assertIn("def _normalize_instruments", overview)\n        self.assertIn("def _ticker_index", overview)\n\n    def test_runner_policy_is_exact_and_release_runs_on_linux(self):\n        checker = (ROOT / ".github" / "scripts" / "check_runner_selectors.py").read_text(encoding="utf-8")\n        for selector in (\n            "[self-hosted, fast]",\n            "[self-hosted, docker]",\n            "[self-hosted, backtester]",\n            "[self-hosted, Linux]",\n            "[self-hosted, macOS, ARM64]",\n        ):\n            self.assertIn(selector, checker)\n\n        release = (ROOT / ".github" / "workflows" / "release.yml").read_text(encoding="utf-8")\n        self.assertIn("runs-on: [self-hosted, Linux]", release)\n        self.assertIn("command -v sha256sum", release)\n        self.assertIn("command -v gh", release)\n\n    def test_production_defaults_remain_fail_closed(self):\n        lifecycle = (ROOT / "mini_app_backend" / "lifecycle.py").read_text(encoding="utf-8")\n        config = (ROOT / "config.py").read_text(encoding="utf-8")\n        self.assertIn("default=False", lifecycle)\n        self.assertIn('"127.0.0.1"', lifecycle)\n        self.assertIn("PUBLIC_ACCESS_ENABLED = parse_bool", config)\n        self.assertIn("default=False", config)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

          python3 .github/scripts/check_runner_selectors.py
          python3 -m compileall -q bot.py alerts mini_app_backend tests

          git add VERSION README.md CHANGELOG.md scripts/update_vds.sh \
            docs/RELEASE_1.3.8.md docs/VDS_BOT_API_ONLY_UPDATE.md \
            .github/workflows/release-audit.yml \
            tests/test_release_1_3_0_contract.py \
            tests/test_release_1_3_7_contract.py \
            tests/test_release_1_3_8_contract.py \
            tests/test_release_metadata_consistency.py
          git commit -m "release: prepare audited fixes as 1.3.8"
          git push origin HEAD:agent/project-audit-optimization-2026-08-11
