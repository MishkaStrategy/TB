name: Funding fast check

on:
  pull_request:
    branches:
      - main
    paths:
      - "alerts/funding*.py"
      - "alerts/multi_funding_alerts.py"
      - "alerts/scheduler.py"
      - "exchanges/funding.py"
      - "handlers/*funding*.py"
      - "tests/test_funding*.py"
      - "tests/test_multi_exchange_funding.py"
      - ".github/workflows/funding-fast-check.yml"
  push:
    branches:
      - main
    paths:
      - "alerts/funding*.py"
      - "alerts/multi_funding_alerts.py"
      - "alerts/scheduler.py"
      - "exchanges/funding.py"
      - "handlers/*funding*.py"
      - "tests/test_funding*.py"
      - "tests/test_multi_exchange_funding.py"
      - ".github/workflows/funding-fast-check.yml"

permissions:
  contents: read

concurrency:
  group: funding-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  funding-tests:
    name: Funding regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_ACCESS_ENABLED: "true"
      MPLCONFIGDIR: ${{ runner.temp }}/trading-assistant-mpl

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile funding sources
        run: >-
          python -m compileall -q
          alerts/funding_alerts.py
          alerts/funding_quarter_hour.py
          alerts/funding_snapshot_store.py
          alerts/funding_exchange_store.py
          alerts/multi_funding_alerts.py
          alerts/scheduler.py
          handlers/multi_funding.py
          handlers/multi_funding_alert_ui.py
          exchanges/funding.py
          tests/test_funding_alerts.py
          tests/test_funding_quarter_hour.py
          tests/test_multi_exchange_funding.py

      - name: Run funding regression tests
        run: >-
          python -m unittest -v
          tests.test_funding_alerts
          tests.test_funding_quarter_hour
          tests.test_multi_exchange_funding
