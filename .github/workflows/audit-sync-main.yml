name: Audit sync current main

on:
  push:
    branches:
      - agent/project-audit-optimization-2026-08-11
    paths:
      - ".github/workflows/audit-sync-main.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted, fast]
    timeout-minutes: 10
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/project-audit-optimization-2026-08-11

      - name: Merge current main and preserve audit runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if (( merge_status != 0 )); then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if (( ${#conflicts[@]} == 0 )); then
              echo "Merge failed without resolvable file conflicts." >&2
              exit "${merge_status}"
            fi
            printf 'Resolving current-main conflicts in favor of main:\n'
            printf '  %s\n' "${conflicts[@]}"
            for path in "${conflicts[@]}"; do
              git checkout --theirs -- "${path}"
              git add -- "${path}"
            done
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("bot.py")
          text = path.read_text(encoding="utf-8")
          anchor = "USER_PREFERENCES = UserPreferences()\n"
          registry = "USER_ACTIVITY_REGISTRY = UserActivityRegistry()\n"
          if registry not in text:
              if anchor not in text:
                  raise SystemExit("USER_PREFERENCES anchor not found in bot.py")
              text = text.replace(anchor, anchor + registry, 1)
          text = text.replace(
              "UserActivityRegistry().touch, user",
              "USER_ACTIVITY_REGISTRY.touch, user",
          )
          if "USER_ACTIVITY_REGISTRY.touch" not in text:
              raise SystemExit("shared activity registry hot-path fix missing")
          path.write_text(text, encoding="utf-8")
          PY
          git add bot.py

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git commit -m "merge: sync audit branch with current main"
          git push origin HEAD:agent/project-audit-optimization-2026-08-11
