name: Publish release from VERSION

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-version-release
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish VERSION tag and release
    runs-on: [self-hosted, fast]
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION value: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "archive=fvg-alert-bot-${version}.tar.gz" >> "${GITHUB_OUTPUT}"

      - name: Build source archive and checksum
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail
          git archive \
            --format=tar.gz \
            --prefix="fvg-alert-bot-${VERSION}/" \
            --output="${ARCHIVE}" \
            HEAD
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          test -s "${ARCHIVE}"
          test -s "${ARCHIVE}.sha256"

      - name: Create tag and GitHub Release when missing
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = process.env.VERSION;
            const tag = process.env.TAG;

            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              release = existing.data;
              core.info(`Release ${tag} already exists: ${release.html_url}`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });
              core.info(`Tag ${tag} already exists.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
              core.info(`Created tag ${tag} at ${context.sha}.`);
            }

            if (release) return;

            const releaseDocument = `docs/RELEASE_${version}.md`;
            let body;
            if (fs.existsSync(releaseDocument)) {
              body = fs.readFileSync(releaseDocument, 'utf8').trim();
            } else {
              const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
              const heading = `## ${version}`;
              const start = changelog.indexOf(heading);
              body = 'See CHANGELOG.md for details.';
              if (start >= 0) {
                const next = changelog.indexOf('\n## ', start + heading.length);
                body = changelog.slice(start, next >= 0 ? next : undefined).trim();
              }
            }

            release = (await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `FVG Alert Bot ${version}`,
              body,
              draft: false,
              prerelease: version.includes('-'),
              generate_release_notes: false,
            })).data;
            core.info(`Created release: ${release.html_url}`);

      - name: Upload release archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" \
            "${ARCHIVE}" \
            "${ARCHIVE}.sha256" \
            --clobber
