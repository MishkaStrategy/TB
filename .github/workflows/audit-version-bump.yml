name: Stage audit version 1.3.8

on:
  push:
    branches:
      - agent/project-audit-optimization-2026-08-11
    paths:
      - ".github/workflows/audit-version-bump.yml"

permissions:
  contents: write

jobs:
  bump:
    runs-on: [self-hosted, fast]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/project-audit-optimization-2026-08-11
      - name: Commit VERSION 1.3.8
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '1.3.8\n' > VERSION
          git add VERSION
          git commit -m "release: bump audit patch to 1.3.8"
          git push origin HEAD:agent/project-audit-optimization-2026-08-11
